# Set mode-keys to emacs
setw -g mode-keys emacs

# Set prefix key to C-t
unbind C-b
set -g prefix C-t
bind C-t send-prefix

# Enable mouse support for scrolling, selecting, and resizing
set -g mouse on

# Access the macOS clipboard from inside tmux
set -g set-clipboard on

# Toggle last window (mimics screen's ^T)
bind-key C-t last-window
bind-key t last-window

# New window key bindings (screen style)
bind-key C-c new-window
bind-key c new-window

# Start window and pane numbering at 1
set -g base-index 1
set -g pane-base-index 1

# Ensure windows are automatically renumbered on close
set-option -g renumber-windows on

# Set 256-color terminal
set -g default-terminal "screen-256color"
# Disables alternate screen so vim/less output stays in scrollback instead of clearing — can cause visual glitches
# set -g terminal-overrides 'xterm*:smcup@:rmcup@'

# Copy selection to macOS clipboard (mode-keys is emacs, so copy-mode not copy-mode-vi)
bind -T copy-mode y send-keys -X copy-pipe-and-cancel "pbcopy"

# Status bar colors (zenburn palette)
set -g status-style "bg=#3F3F3F,fg=#9F9F8F"

# Inactive windows: muted
setw -g window-status-format "#[fg=#7F7F6F] #I:#W "
setw -g window-status-style "bg=#3F3F3F"

# Active window: white on black regardless of state
setw -g window-status-current-format "#[fg=#DCDCCC,bold,bg=#2A2A2A] #I:#W "
setw -g window-status-current-style "bg=#2A2A2A"

# Window list left-aligned; hide session name
set-option -g status-justify left
set-option -g status-left ""
set-option -g status-left-length 0

# Right: Claude session state dots (red=waiting, green=working, nothing=idle)
set-option -g status-right "#(tmux-windows --status)"
set-option -g status-right-length 25
set-option -g status-interval 1

# Activity and bell notification (closer to screen)
set -g visual-bell off
set -g bell-action none

# Optional: Pre-create windows/tabs
# if-shell '[[ $(tmux display-message -p "#{session_windows}") -eq 1 ]]' \
#   "new-window -n NEW; new-window -n NEW; new-window -n NEW; new-window -n NEW"

# Claude session management
bind-key y run-shell "launch-claude.sh '#{pane_current_path}'"
bind-key u display-popup -w 90% -h 90% -E "tmux-windows"
